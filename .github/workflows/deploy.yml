name: Сборка и деплой

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Секретов в репозитории нет: в Azure входим по OIDC, в GHCR — встроенным токеном.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RESOURCE_GROUP: razgon-rg
  CONTAINER_APP: razgon-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установить зависимости
        working-directory: app
        run: npm ci

      # Проверки до сборки образа: сломанная прогрессия не должна доехать до телефона.
      - name: Проверки
        working-directory: app
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Войти в Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Тег по SHA, а не latest: ACA создаёт новую ревизию только когда
      # образ реально изменился, а latest для него выглядит той же строкой.
      - name: Обновить образ приложения
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Показать адрес
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv
